<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pictogrammes rz-tablet</title>
<style>
  :root { color-scheme: dark; --bg: #111214; --card: #1b1c20; --line: #2a2b31; --text: #f2f2f4; --muted: #9a9ba3; --accent: #0a84ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; padding: 16px 20px; background: rgba(17, 18, 20, .86); backdrop-filter: blur(20px); border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
  h1 { margin: 0; font-size: 17px; font-weight: 650; }
  h1 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  input { flex: 1; min-width: 220px; height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); font: inherit; outline: none; }
  input:focus { border-color: var(--accent); }
  .hint { width: 100%; margin: 0; color: var(--muted); font-size: 13px; }
  .hint code { color: var(--text); background: var(--card); padding: 1px 6px; border-radius: 5px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; padding: 16px 20px 40px; }
  button { display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 14px 6px 10px; border: 1px solid transparent; border-radius: 12px;
    background: var(--card); color: var(--text); font: inherit; cursor: pointer; transition: transform 120ms ease-out, border-color 120ms ease; }
  button:hover { border-color: var(--line); }
  button:active { transform: scale(.96); }
  .ic { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; color: #fff;
    background: linear-gradient(180deg, #47c1ff, #0a60e4); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }
  .ic svg { width: 60%; height: 60%; }
  .nm { font-size: 12px; color: var(--muted); max-width: 100%; overflow-wrap: anywhere; text-align: center; }
  button.ok .nm { color: #30d158; }
  .empty { grid-column: 1 / -1; padding: 60px 0; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Pictogrammes<small id="count"></small></h1>
  <input id="q" type="search" placeholder="Rechercher en anglais : car, house, phone, money..." autofocus>
  <p class="hint">Clic sur une icône = nom copié. À coller dans <code>Config.AppIcons</code> (ex. <code>store = 'storefront'</code>) ou dans le champ <code>icon</code> d'une app de <code>Config.Store</code>.</p>
</header>
<main id="grid"></main>
<script>
  // Meme pack que la tablette (html/assets/icons/duotone.json) : seuls ces noms marchent
  const grid = document.getElementById('grid'), q = document.getElementById('q');
  let all = {}, names = [];
  const svg = (inner) => '<svg viewBox="0 0 256 256" fill="currentColor">' + inner + '</svg>';
  function show() {
    const t = q.value.trim().toLowerCase().replace(/\s+/g, '-');
    const list = t ? names.filter((n) => n.includes(t)) : names;
    document.getElementById('count').textContent = list.length + ' / ' + names.length;
    grid.textContent = '';
    if (!list.length) { grid.innerHTML = '<div class="empty">Aucun pictogramme</div>'; return; }
    const frag = document.createDocumentFragment();
    list.forEach((n) => {
      const b = document.createElement('button');
      b.innerHTML = '<span class="ic">' + svg(all[n]) + '</span><span class="nm"></span>';
      b.querySelector('.nm').textContent = n;
      b.onclick = () => {
        const done = () => { b.classList.add('ok'); b.querySelector('.nm').textContent = 'copié'; setTimeout(() => { b.classList.remove('ok'); b.querySelector('.nm').textContent = n; }, 900); };
        if (navigator.clipboard) navigator.clipboard.writeText(n).then(done, () => prompt('Nom :', n)); else prompt('Nom :', n);
      };
      frag.append(b);
    });
    grid.append(frag);
  }
  fetch('../html/assets/icons/duotone.json').then((r) => r.json()).then((j) => { all = j; names = Object.keys(j).sort(); show(); })
    .catch(() => { grid.innerHTML = '<div class="empty">Ouvre cette page avec le banc (lancer.bat) : http://localhost:8787/dev/pictos.html</div>'; });
  q.addEventListener('input', show);
</script>
</body>
</html>
